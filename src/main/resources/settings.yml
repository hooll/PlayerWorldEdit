material-pack-gui:
  title: '&f材料背包 &4| 切勿放置其他物品 仅放材料'
  lore:
    take-1: "&7| 左键 取出 x1"
    take-10: "&7| 右键 取出 x10"
    take-64: "&7| SHIFT+右键 取出 x64"
    amount: "&7| 数量: &e%amount%"
world-edit:
  tool:
    name: "&7[&f创世神镐&7]"
    type: "DIAMOND_PICKAXE"
    custom-model-data: 0
    lore:
      - "&7| 可在生存模式中使用的创世神功能"
      - "&7| 需要消耗材料背包中的材料"
      - "&7| 手持 SHIFT+右键打开快捷操作 "
      - " "
      - "&f| 左键设置第一个点"
      - "&f| 右键设置第二个点"
      - " "
  region-particle: "VILLAGER_ANGRY"
  # 选区可视化: 半透明玻璃盒子 (仿 Dominion)。关掉则用上面的粒子边框
  region-display: true
  region-display-material: "WHITE_STAINED_GLASS"
  # 盒子只发给选区主人自己看 (false = 附近所有人都能看到)
  region-display-owner-only: true
  # 盒子显示多少秒后自动收掉, 0 = 不自动收
  region-display-duration: 10
  undo-limit: 10
  # 性能: 全服每 tick 允许改动的方块总数。越小越不卡, 大范围操作耗时越长
  blocks-per-tick: 20000
  # 编辑时带上玩家身份, 装了 CoreProtect 才会把改动记到玩家名下 (可以用 /co rollback 回滚)
  coreprotect-logging: true
